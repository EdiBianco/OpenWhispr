# Secret-scan rules for this repo. Extends gitleaks defaults; the same rules run locally and in CI.
title = "personal gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
keywords = ["gsk_"]

[[rules]]
id = "signing-password"
description = "Android signing password literal in source"
regex = '''(storePassword|keyPassword)\s*=\s*"[^"\s]{4,}"'''
keywords = ["storepassword", "keypassword"]

[allowlist]
description = "Placeholders and docs"
regexes = ['''gsk_(…|\.\.\.)''', '''gsk_X+''']

# The old debug keystore password is Android's public default ("android"), not a secret.
# It appears in history from before the debug keystore was removed.
[[allowlists]]
description = "Public Android debug keystore password"
regexes = ['''(storePassword|keyPassword)\s*=\s*"android"''']
