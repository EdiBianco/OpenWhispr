name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with commit SHA
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/phone-whisper-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-debug-apk
          path: dist/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dictate
          name: Phone Whisper (Groq) — debug build
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Uses Groq for transcription (whisper-large-v3) and cleanup (llama-3.3-70b-versatile).
          prerelease: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
