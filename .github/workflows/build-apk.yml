name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Android SDK platform 35 is installed
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -n -A 25 "FAILURE:" build.log | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/openwispr-v${{ steps.version.outputs.version }}-debug.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-debug-apk
          path: dist/*.apk

      - name: Extract changelog for this version
        id: changelog
        run: |
          NOTES=$(awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " ver "$" { flag=1; next }
            /^## / { flag=0 }
            flag && NF { print }
          ' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenWispr v${{ steps.version.outputs.version }}
          body: |
            Free, open-source push-to-talk dictation for Android. Debug build from commit `${{ github.sha }}`.
            Transcription + cleanup via Groq (`whisper-large-v3` + `openai/gpt-oss-120b`) with your own API key, or fully on-device with no key or internet needed.

            **What's new:**
            <!--WHATS_NEW_START-->
            ${{ steps.changelog.outputs.notes }}
            <!--WHATS_NEW_END-->
          generate_release_notes: true
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
